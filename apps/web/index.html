<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/url-keep-favicon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>url-keep</title>
    <script>
      try {
        if (
          /^\/(?:read|s)\//.test(window.location.pathname)
          && window.localStorage.getItem("url_keep_reader_theme") === "dark"
        ) {
          document.documentElement.dataset.readerTheme = "dark";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
