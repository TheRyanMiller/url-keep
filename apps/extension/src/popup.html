<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./url-keep-icon-32.png" />
    <title>url-keep</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header row-between">
        <div class="brand">
          <img class="brand-logo" src="./url-keep-logo.png" alt="url-keep" />
        </div>
        <button class="text-button" id="settings-toggle" type="button">settings</button>
      </header>

      <form class="stack" id="login-form">
        <label class="field">
          <span>email</span>
          <input id="email" type="email" autocomplete="email" />
        </label>
        <label class="field">
          <span>password</span>
          <input id="password" type="password" autocomplete="current-password" />
        </label>
        <button class="button" type="submit">log in</button>
      </form>

      <section class="stack hidden" id="bookmark-view">
        <p class="muted" id="domain"></p>
        <button class="button" id="action-button" type="button">save</button>
        <p class="muted state-row">
          <span id="state-note"></span>
          <button class="text-link hidden" id="delete-link" type="button">remove</button>
        </p>
        <a
          class="text-action link-with-icon"
          id="open-app-link"
          rel="noreferrer noopener"
          target="_blank"
        >
          <span>open app</span>
          <span aria-hidden="true" class="link-icon">↗</span>
        </a>
      </section>

      <form class="stack hidden" id="settings-form">
        <label class="field">
          <span>api origin</span>
          <input
            id="settings-api-origin"
            type="url"
            inputmode="url"
            placeholder="https://api.example.com"
          />
        </label>
        <label class="field">
          <span>app origin</span>
          <input
            id="settings-app-origin"
            type="url"
            inputmode="url"
            placeholder="https://app.example.com"
          />
        </label>
        <label class="field-row">
          <input id="settings-quick-save" type="checkbox" />
          <span>single click save</span>
        </label>
        <button class="button" type="submit">save settings</button>
        <button class="text-button left" id="reset-settings" type="button">use defaults</button>
        <p class="muted">changing servers signs you out</p>
      </form>

      <p class="error" id="error"></p>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
  </html>
